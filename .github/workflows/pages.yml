name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and explorer behavior
        run: npm run check
      - name: Validate research schema and reproducible database
        run: |
          python3 scripts/test-research-schema.py
          python3 scripts/build-research-database.py
      - name: Prepare public files
        run: node scripts/build.mjs
      - name: Validate published sharing assets
        run: node scripts/check-sharing.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
